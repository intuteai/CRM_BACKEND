openapi: 3.0.3
info:
  title: Motor Test ERP API (HMI <-> ERP)
  version: 0.2.0-draft
  description: |
    EARLY DRAFT v0.2 (2026-11-07) for Pratham's HMI client. v0.2 adds the operator pick-list
    (GET /api/testing/operators; uploads carry operator_ref + operator_name instead of free text). Not frozen: becomes Interface Contract v1
    after T012 sign-off by Mayank, Pratham and Rahul. Example JSON for every case is in fixtures/,
    hash test vectors in vectors/ (both generated by tools/generate-fixtures.js).

    Conventions
    - Auth: existing ERP login. Send `Authorization: Bearer <token>` and `X-App-Version: <app version>`
      on every call (12 h token). Token expiry = JWT `exp` claim, or GET /api/testing/me.
    - Errors: `{ "error": "<human message>", "code": "<MACHINE_CODE>", ...details }`. Act on `code`.
      Only AUTH_INVALID_TOKEN and AUTH_INVALID_USER mean "log in again".
    - Timestamps ISO 8601 UTC (`2026-12-01T09:14:03Z`). Units SI, unit in the field name.
    - IDs: test_id, receipt_id, variant/profile/criteria ids are UUID v4. User ids are integers.
    - Digests and hashes: `sha256:` + 64 lowercase hex.
servers:
  - url: https://{host}
    variables:
      host:
        default: staging-host-TBD
        description: Staging URL to be shared with Pratham (T049); production later.
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: config
  - name: results
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Existing ERP login (unchanged)
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: testing@compageauto.com }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in. Fixture 01-login.json.
          content:
            application/json:
              schema:
                type: object
                required: [role, token, name, user_id]
                properties:
                  role: { type: string, example: employee }
                  token: { type: string, description: 'JWT HS256; payload {user_id, role_id, name, iat, exp}' }
                  name: { type: string }
                  user_id: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/testing/me:
    get:
      tags: [auth]
      summary: NEW - current user, testing roles and token expiry
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Fixture 02-me.json.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, name, testing_roles, token_expires_at]
                properties:
                  user_id: { type: integer }
                  name: { type: string }
                  testing_roles:
                    type: array
                    items: { type: string, enum: [testing_head, operator, viewer, testing_admin] }
                  token_expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/testing/operators:
    get:
      tags: [config]
      summary: NEW v0.2 - operator pick-list (managed in the ERP by the testing head)
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Fixture 07-operators.json. Show active operators; cache for offline use.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [operator_ref, name, active]
                      properties:
                        operator_ref: { type: string, format: uuid }
                        name: { type: string }
                        active: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/testing/variants:
    get:
      tags: [config]
      summary: Active motor variants
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Fixture 04-variants-list.json.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VariantSummary' } }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/testing/variants/{variant_id}:
    get:
      tags: [config]
      summary: Variant with its current PUBLISHED profile and criteria
      parameters:
        - { name: variant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fixture 05-variant-detail.json. Cache profile + criteria with their sha256.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: NOT_PUBLISHED, $ref: '#/components/responses/Error' }
  /api/testing/criteria/{criteria_version_id}:
    get:
      tags: [config]
      summary: Exact historical criteria snapshot (any version ever published)
      parameters:
        - { name: criteria_version_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fixture 06-criteria-snapshot.json.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CriteriaVersion' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/testing/results:
    post:
      tags: [results]
      summary: Store one final reconciled run - atomic and idempotent on test_id
      description: |
        Requires the `operator` testing role (else 403 TESTING_ROLE_REQUIRED). Any user with that role may
        upload a queued run; `operator_id`/`operator_name` in the body are never changed and the ERP
        records the authenticated uploader separately (`uploaded_by`, not part of payload_hash).

        payload_hash = SHA-256 of the RFC 8785 canonical JSON of the whole body (vectors/payload-hash-vectors.json).
        - New test_id -> 201 + receipt (fixture 10).
        - Same test_id + same payload_hash -> 200 + the ORIGINAL receipt (fixture 11).
        - Same test_id + different payload_hash -> 409 PAYLOAD_CONFLICT, original kept, conflict audited (fixture 12).
        - Everything is validated before the database transaction; a rejected upload stores nothing.
        - Only a 201/200 receipt allows ACK_ARCHIVED (with the manifest run_digest and receipt_id).

        Consistency rules (422 INCONSISTENT_RUN):
        - PASS / FAIL / INVALID require final_state COMPLETED; ABORTED and FAULT runs must be INCOMPLETE.
        - COMPLETED requires sample_count > 0. FAULT/ABORTED may have 0 samples (fixture 13).
        - Samples strictly ascending by sample_seq, every sample_seq < sample_count.
        - PASS / FAIL / INVALID need samples 0..sample_count-1 with no gaps and run_digest equal to the digest of the uploaded samples.
        - Validity bit and value must agree (D13): bit 0 -> null, bit 1 -> finite number.
        OPEN (D11, testing head): COMPLETED run with unrecoverable gaps -> proposed: accepted as INCOMPLETE.
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - name: Idempotency-Key
          in: header
          required: true
          description: Must equal body.test_id.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunUpload' }
      responses:
        '201':
          description: Stored. Fixtures 10, 13, 14.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '200':
          description: Identical retry; original receipt. Fixture 11.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { description: 'VALIDATION_ERROR (fields[]) or UNKNOWN_REFERENCE. Fixtures 20, 21, 22, 28, 31.', $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'AUTH_INVALID_TOKEN (re-login) or TESTING_ROLE_REQUIRED (NEEDS_REVIEW). Fixture 03.', $ref: '#/components/responses/Error' }
        '409': { description: 'PAYLOAD_CONFLICT. Fixture 12.', $ref: '#/components/responses/Error' }
        '413': { description: 'PAYLOAD_TOO_LARGE (limit 5 MB). Fixture 29.', $ref: '#/components/responses/Error' }
        '422': { description: 'INCONSISTENT_RUN (violations[]). Fixtures 23-27.', $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { description: 'SERVER_UNAVAILABLE / AUTH_UNAVAILABLE - nothing committed, retry same body with backoff. Fixture 30.', $ref: '#/components/responses/Error' }
    get:
      tags: [results]
      summary: All runs for one exact motor serial, newest first (viewer, testing_head, testing_admin)
      parameters:
        - { name: serial, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Fixture 40-results-by-serial.json.
          content:
            application/json:
              schema:
                type: object
                properties:
                  motor_serial: { type: string }
                  runs: { type: array, items: { $ref: '#/components/schemas/RunSummary' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/testing/results/{test_id}:
    get:
      tags: [results]
      summary: Full run with samples, events and the exact profile + criteria snapshot used
      parameters:
        - { name: test_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: RunUpload fields plus uploaded_by, received_at, receipt, profile and criteria snapshots.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunUpload'
                  - type: object
                    properties:
                      uploaded_by: { type: integer }
                      received_at: { type: string, format: date-time }
                      receipt: { $ref: '#/components/schemas/Receipt' }
                      profile: { $ref: '#/components/schemas/Profile' }
                      criteria: { $ref: '#/components/schemas/CriteriaVersion' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: HMI app version (semver). Gives the 12 h token at login; send on every call.
      schema: { type: string, example: 1.0.0 }
  responses:
    Error:
      description: Error. Body {error, code, ...details}.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Human message for display }
        code:
          type: string
          enum: [AUTH_MISSING_FIELDS, AUTH_INVALID_CREDENTIALS, AUTH_NO_TOKEN, AUTH_INVALID_TOKEN, AUTH_INVALID_USER, AUTH_UNAVAILABLE,
                 TESTING_ROLE_REQUIRED, PERM_DENIED, RATE_LIMIT_EXCEEDED, NOT_FOUND, NOT_PUBLISHED,
                 VALIDATION_ERROR, UNKNOWN_REFERENCE, PAYLOAD_CONFLICT, PAYLOAD_TOO_LARGE, INCONSISTENT_RUN, SERVER_UNAVAILABLE]
        fields:
          type: array
          description: VALIDATION_ERROR / UNKNOWN_REFERENCE
          items: { type: object, properties: { path: { type: string }, msg: { type: string } } }
        violations:
          type: array
          description: INCONSISTENT_RUN
          items: { type: object, properties: { path: { type: string }, rule: { type: string }, msg: { type: string } } }
        test_id: { type: string, format: uuid }
        existing_payload_hash: { $ref: '#/components/schemas/Digest' }
        received_payload_hash: { $ref: '#/components/schemas/Digest' }
        required_role: { type: string }
    VariantSummary:
      type: object
      properties:
        variant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        product_id: { type: integer, description: inventory.product_id }
        active: { type: boolean }
        has_published_config: { type: boolean }
    Profile:
      type: object
      required: [profile_id, variant_id, version, max_rpm, step_rpm, duration_s, sample_hz, sha256, status]
      properties:
        profile_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        version: { type: integer }
        max_rpm: { type: integer }
        step_rpm: { type: integer }
        duration_s: { type: integer }
        sample_hz: { type: integer }
        sha256: { $ref: '#/components/schemas/Digest' }
        status: { type: string, enum: [PUBLISHED, SUPERSEDED, WITHDRAWN] }
        published_at: { type: string, format: date-time }
    CriteriaVersion:
      type: object
      required: [criteria_version_id, version, sha256, status, definition]
      properties:
        criteria_version_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        version: { type: integer }
        sha256: { $ref: '#/components/schemas/Digest' }
        status: { type: string, enum: [PUBLISHED, SUPERSEDED, WITHDRAWN] }
        published_at: { type: string, format: date-time }
        definition: { type: object, description: 'criteria_json; values only from the signed sheet (D5)' }
    VariantDetail:
      allOf:
        - $ref: '#/components/schemas/VariantSummary'
        - type: object
          properties:
            serial_pattern: { type: string, nullable: true }
            max_rpm_limit: { type: integer, nullable: true }
            profile: { $ref: '#/components/schemas/Profile' }
            criteria: { $ref: '#/components/schemas/CriteriaVersion' }
    Sample:
      type: object
      additionalProperties: false
      required: [sample_seq, t_ms, rpm_cmd, rpm_actual, current_a, voltage_v, bemf_v, status_flags]
      properties:
        sample_seq: { type: integer, minimum: 0, maximum: 4294967295 }
        t_ms: { type: integer, minimum: 0, maximum: 4294967295 }
        rpm_cmd: { type: integer, minimum: -2147483648, maximum: 2147483647 }
        rpm_actual: { type: integer, minimum: -2147483648, maximum: 2147483647 }
        current_a: { type: number, nullable: true, description: 'null iff status_flags b1 = 0; shortest float32 round-trip decimal' }
        voltage_v: { type: number, nullable: true, description: 'null iff status_flags b2 = 0' }
        bemf_v: { type: number, nullable: true, description: 'null iff status_flags b3 = 0' }
        status_flags: { type: integer, minimum: 0, maximum: 255, description: 'b0 rpm valid, b1 I, b2 V, b3 BEMF, b4 CAN stale, b5 setpoint changed, b6 protective warning, b7 storage lag; b8-b15 must be 0' }
    Event:
      type: object
      required: [t_ms, type, code]
      properties:
        t_ms: { type: integer, minimum: 0 }
        type: { type: string, enum: [STATE, FAULT, COMMAND, INFO] }
        code: { type: string }
        detail: { type: string, nullable: true }
    RunUpload:
      type: object
      additionalProperties: false
      required: [test_id, motor_serial, variant_id, profile_id, profile_sha256, criteria_version_id, criteria_sha256,
                 operator_id, operator_ref, operator_name, vcu, hmi_version, started_at, ended_at, final_state, stop_reason, fault_code,
                 outcome, outcome_reasons, sample_count, run_digest, events, samples]
      properties:
        test_id: { type: string, format: uuid, description: UUID v4 created once by the HMI; retest = new UUID }
        motor_serial: { type: string, minLength: 1, maxLength: 64 }
        variant_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        profile_sha256: { $ref: '#/components/schemas/Digest' }
        criteria_version_id: { type: string, format: uuid }
        criteria_sha256: { $ref: '#/components/schemas/Digest' }
        operator_id: { type: integer, description: ERP user who ran the test (the shared testing account for now) }
        operator_ref: { type: string, format: uuid, description: 'Person picked from GET /api/testing/operators; must have been active when the run started, else 400 UNKNOWN_REFERENCE (fixture 31)' }
        operator_name: { type: string, minLength: 1, maxLength: 100, description: Snapshot of the picked name at test time (kept even if the list changes later) }
        vcu:
          type: object
          additionalProperties: false
          required: [vcu_id, fw_version, boot_id]
          properties:
            vcu_id: { type: string }
            fw_version: { type: string }
            boot_id: { type: string }
        hmi_version: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        final_state: { type: string, enum: [COMPLETED, ABORTED, FAULT] }
        stop_reason: { type: string, enum: [RAMP_COMPLETE, OPERATOR_STOP, HB_LOSS, FAULT, POWER_LOSS] }
        fault_code: { type: string, nullable: true, description: 'F_* catalogue; required when final_state = FAULT' }
        outcome: { type: string, enum: [PASS, FAIL, INCOMPLETE, INVALID] }
        outcome_reasons:
          type: array
          items:
            type: object
            properties:
              criterion: { type: string, nullable: true }
              reason: { type: string }
              measured: { type: number, nullable: true }
              limit: { type: number, nullable: true }
              unit: { type: string }
              rpm_window: { type: array, items: { type: integer } }
              samples: { type: array, items: { type: integer } }
              detail: { type: string, nullable: true }
        sample_count: { type: integer, minimum: 0, description: VCU manifest count }
        run_digest: { $ref: '#/components/schemas/Digest' }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        samples: { type: array, maxItems: 40000, description: 'max 40000 so a run fits the 5 MB body limit', items: { $ref: '#/components/schemas/Sample' } }
    Receipt:
      type: object
      required: [receipt_id, test_id, stored_sample_count, payload_hash, samples_digest, run_digest_match, stored_at]
      properties:
        receipt_id: { type: string, format: uuid }
        test_id: { type: string, format: uuid }
        stored_sample_count: { type: integer }
        payload_hash: { $ref: '#/components/schemas/Digest' }
        samples_digest: { $ref: '#/components/schemas/Digest', description: D13 digest the ERP computed over the stored samples }
        run_digest_match: { type: boolean, description: samples_digest equals run_digest }
        stored_at: { type: string, format: date-time, description: Time of the original commit (unchanged on retries) }
    RunSummary:
      type: object
      properties:
        test_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        final_state: { type: string }
        outcome: { type: string }
        operator_id: { type: integer }
        operator_ref: { type: string, format: uuid }
        operator_name: { type: string }
        uploaded_by: { type: integer }
        variant_code: { type: string }
        profile_version: { type: integer }
        criteria_version: { type: integer }
        sample_count: { type: integer }
        stored_sample_count: { type: integer }
        received_at: { type: string, format: date-time }
