openapi: 3.0.3
info:
  title: Motor Test ERP API (HMI <-> ERP)
  version: 0.5.0-draft
  description: |
    v0.5 (DRAFT R4, 2026-11-21): implemented in the ERP backend and tested against staging, NOT deployed yet. It goes to
    staging with the next backend deploy and to production after Mayank's final review. Spec: v05-warning-events.md (R4)
    and receipt-signing.md section 11 (MTRCPT2).
    - Opt-in per upload with `contract_version: "0.5"` (schema RunUploadV05). v0.5 is a superset of v0.4: the v0.4
      body plus capture_end_ms, event_log, warnings[] (WarningEvent), command_changes[] (CommandChange) and
      event_digest (MTEVT2, computed by the VCU). v0.3 (no contract_version) and v0.4 uploads stay accepted unchanged.
    - New rejections: 400 VALIDATION_ERROR with fields [{path: "events", msg: "EVENT_FIELDS: <message>"}]; 422
      INCONSISTENT_RUN violations with path "events" and the rules EVENT_ORDER, EVENT_PHASE, EVENT_CAUSALITY, EVENT_COUNTS,
      WARNING_PAIRING, COMMAND_ORDER, COMMAND_LINK, COMMAND_WINDOW, COMMAND_MISSING_STEP0 and CANCEL_SHAPE.
    - Receipt version pinned per run: a v0.4 run gets an MTRCPT1 signed_receipt, a v0.5 run an MTRCPT2 one (event block
      with event_digest, the ERP's recomputed events_stored_digest, counts, event flags and capture bounds). The ERP
      stores receipt_version (1 or 2) with the run; the VCU selects the decoder from its own manifest, never by the magic.
    - Run detail returns receipt_version and (v0.5 runs) the stored event facts, including unproven[] records of an
      incomplete log; the serial lookup adds event_log_complete and unproven_count.
    v0.5 example JSON: fixtures 70-76.

    v0.4 (2026-11-19): live on staging and production (commit 69aacd0c). Receipts signed on staging (key 70e57bbf84ae97cc); production key 61322efab675c04c loaded, signing from the first real bench upload. Contract text is a draft until T012.

    What changed in v0.4 (spec: receipt-signing.md, sections 2-6):
    - Opt-in per upload: a body with `contract_version: "0.4"` is a v0.4 upload (schema RunUploadV04). A body
      without `contract_version` is a v0.3 upload (schema RunUpload, the format the deployed tablet app sends)
      and stays accepted unchanged, except that the lifecycle table (final_state -> permitted stop_reason) now
      applies to every upload, v0.3 included.
    - New upload fields: run_kind, started, start_uptime_ms, started_at_source, ended_at_source, hmi_auto_time,
      held_count, recording_complete, config_hash; `vcu.boot_id` is replaced by `vcu.origin_boot_id`;
      stop_reason gains CONFIG_CANCELLED (CANCEL before start).
    - Completeness: run_digest covers the held samples 0..held_count-1; a verdict needs recording_complete = true.
    - v0.4 receipts carry `signed_receipt` (Ed25519, receipt-signing.md sections 4-5) so the VCU can verify the
      receipt before ACK_ARCHIVED. v0.3 receipts never carry it.
    - New 422 RUN_KIND_NOT_ALLOWED; new INCONSISTENT_RUN rules; run detail returns the v0.4 fields.
    v0.4 example JSON: fixtures 60-68.

    History: v0.3 (2026-11-10) for Pratham's HMI client. v0.2 added the operator pick-list
    (GET /api/testing/operators; uploads carry operator_ref + operator_name instead of free text).
    v0.3 moves corrections to the tablet: operators look up runs by serial and request corrections
    (POST/GET /api/testing/results/{test_id}/corrections), so operators never need the web CRM. Not frozen: becomes Interface Contract v1
    after T012 sign-off by Mayank, Pratham and Rahul. Example JSON for every case is in fixtures/,
    hash test vectors in vectors/ (both generated by tools/generate-fixtures.js).

    Conventions
    - Auth: existing ERP login. Send `Authorization: Bearer <token>` and `X-App-Version: <app version>`
      on every call (12 h token). Token expiry = JWT `exp` claim, or GET /api/testing/me.
    - Errors: `{ "error": "<human message>", "code": "<MACHINE_CODE>", ...details }`. Act on `code`.
      Only AUTH_INVALID_TOKEN and AUTH_INVALID_USER mean "log in again".
    - Timestamps ISO 8601 UTC (`2026-12-01T09:14:03Z`). Units SI, unit in the field name.
    - IDs: test_id, receipt_id, variant/profile/criteria ids are UUID v4. User ids are integers.
    - Digests and hashes: `sha256:` + 64 lowercase hex.
servers:
  - url: https://{host}
    variables:
      host:
        default: api.intute.biz/staging
        description: 'Staging (live since 2026-11-12; every request also needs the X-Staging-Key header). Production: api.intute.biz'
security:
  - bearerAuth: []
tags:
  - name: auth
  - name: config
  - name: results
paths:
  /api/auth/login:
    post:
      tags: [auth]
      summary: Existing ERP login (unchanged)
      security: []
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: testing@compageauto.com }
                password: { type: string, format: password }
      responses:
        '200':
          description: Logged in. Fixture 01-login.json.
          content:
            application/json:
              schema:
                type: object
                required: [role, token, name, user_id]
                properties:
                  role: { type: string, example: employee }
                  token: { type: string, description: 'JWT HS256; payload {user_id, role_id, name, iat, exp}' }
                  name: { type: string }
                  user_id: { type: integer }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /api/testing/me:
    get:
      tags: [auth]
      summary: NEW - current user, testing roles and token expiry
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Fixture 02-me.json.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, name, testing_roles, token_expires_at]
                properties:
                  user_id: { type: integer }
                  name: { type: string }
                  testing_roles:
                    type: array
                    items: { type: string, enum: [testing_head, operator, viewer, testing_admin] }
                  token_expires_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/testing/operators:
    get:
      tags: [config]
      summary: NEW v0.2 - operator pick-list (managed in the ERP by the testing head)
      parameters:
        - $ref: '#/components/parameters/AppVersion'
      responses:
        '200':
          description: Fixture 07-operators.json. Show active operators; cache for offline use.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [operator_ref, name, active]
                      properties:
                        operator_ref: { type: string, format: uuid }
                        name: { type: string }
                        active: { type: boolean }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/testing/variants:
    get:
      tags: [config]
      summary: Active motor variants
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Fixture 04-variants-list.json.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/VariantSummary' } }
                  page: { type: integer }
                  page_size: { type: integer }
                  total: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/testing/variants/{variant_id}:
    get:
      tags: [config]
      summary: Variant with its current PUBLISHED profile and criteria
      parameters:
        - { name: variant_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fixture 05-variant-detail.json. Cache profile + criteria with their sha256.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VariantDetail' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { description: NOT_PUBLISHED, $ref: '#/components/responses/Error' }
  /api/testing/criteria/{criteria_version_id}:
    get:
      tags: [config]
      summary: Exact historical criteria snapshot (any version ever published)
      parameters:
        - { name: criteria_version_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Fixture 06-criteria-snapshot.json.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CriteriaVersion' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/testing/results:
    post:
      tags: [results]
      summary: Store one final reconciled run - atomic and idempotent on test_id
      description: |
        Requires the `operator` testing role (else 403 TESTING_ROLE_REQUIRED). Any user with that role may
        upload a queued run; `operator_id`/`operator_name` in the body are never changed and the ERP
        records the authenticated uploader separately (`uploaded_by`, not part of payload_hash).

        payload_hash = SHA-256 of the RFC 8785 canonical JSON of the whole body (vectors/payload-hash-vectors.json).
        - New test_id -> 201 + receipt (fixture 10).
        - Same test_id + same payload_hash -> 200 + the ORIGINAL receipt (fixture 11).
        - Same test_id + different payload_hash -> 409 PAYLOAD_CONFLICT, original kept, conflict audited (fixture 12).
        - Everything is validated before the database transaction; a rejected upload stores nothing.
        - Only a 201/200 receipt allows ACK_ARCHIVED (with the manifest run_digest and receipt_id).

        Versions: body without `contract_version` = v0.3 (RunUpload); `contract_version: "0.4"` = v0.4 (RunUploadV04,
        live on staging and production). v0.3 and v0.4 field sets are exclusive: `vcu.boot_id` in a v0.4 body is 400 (fixture 67).

        Consistency rules (422 INCONSISTENT_RUN, violations[] with the rule name):
        - LIFECYCLE_STOP_REASON (v0.3 and v0.4): COMPLETED -> RAMP_COMPLETE; ABORTED -> OPERATOR_STOP | HB_LOSS |
          CONFIG_CANCELLED; FAULT -> FAULT | POWER_LOSS. So a v0.3 ABORTED + POWER_LOSS is now rejected (fixture 68);
          v0.4 fixture 65.
        - PASS_REQUIRES_COMPLETED: PASS / FAIL / INVALID require final_state COMPLETED; ABORTED and FAULT runs must be INCOMPLETE.
        - COMPLETED requires sample_count > 0. FAULT/ABORTED may have 0 samples (fixture 13).
        - Samples strictly ascending by sample_seq, every sample_seq < sample_count (v0.4: < held_count, SEQ_OUT_OF_RANGE).
        - COMPLETE_EVIDENCE_REQUIRED / DIGEST_MATCH_REQUIRED: PASS / FAIL / INVALID need samples 0..sample_count-1
          (v0.4: 0..held_count-1) with no gaps and run_digest equal to the digest of the uploaded samples.
        - VALIDITY_FLAG_MISMATCH: validity bit and value must agree (D13): bit 0 -> null, bit 1 -> finite number.
        v0.4 only:
        - RECORDING_COMPLETE_REQUIRED: PASS / FAIL / INVALID also need recording_complete = true (fixture 66).
        - RECORDING_COMPLETE_COUNTS: recording_complete = true needs held_count = sample_count.
        - CANCEL_SHAPE: started = false needs sample_count 0, held_count 0, no samples, started_at null, start_uptime_ms null,
          final_state ABORTED, stop_reason CONFIG_CANCELLED, outcome INCOMPLETE, recording_complete true (fixture 61).
        - started = true: START_UPTIME_REQUIRED when start_uptime_ms is null; CANCEL_SHAPE when stop_reason is CONFIG_CANCELLED.
        - HELD_COUNT_RANGE: held_count <= sample_count. TOO_MANY_SAMPLES: samples.length <= held_count.
          SEQ_OUT_OF_RANGE: every sample_seq < held_count.
        - TIME_SOURCE: started_at_source is null exactly when started_at is null; same for ended_at_source / ended_at.
        run_kind (v0.4): production accepts only `bench`; staging also accepts `host_simulation` and `synthetic`.
        Otherwise 422 RUN_KIND_NOT_ALLOWED (fixture 64).

        Receipt: a v0.4 201/200 receipt also has `signed_receipt` (or null when the server has no signing key configured).
        A 200 identical retry returns the byte-identical receipt, signed_receipt included. 409 and every 4xx/5xx never carry it.
        OPEN (D11, testing head): COMPLETED run with unrecoverable gaps -> proposed: accepted as INCOMPLETE.

        v0.5 (`contract_version: "0.5"`, RunUploadV05; DRAFT R4, not deployed yet; v05-warning-events.md). Every v0.4 rule
        above applies too. The event section (capture_end_ms, event_log, warnings, command_changes, event_digest) is checked
        after the v0.4 rules; the first event failure is reported (at most one event error per response):
        - 400 VALIDATION_ERROR, fields [{path: "events", msg: "EVENT_FIELDS: <message>"}] (fixture 74): a wrong type, range
          or enum (enum values must be exact own values: "toString" is rejected), or a field combination not allowed by
          WarningEvent / CommandChange / EventLog. This 400 replaces any v0.4 422 violations of the same body.
        - 422 INCONSISTENT_RUN, violations [{path: "events", rule, msg}] (fixtures 73, 75), next to any v0.4 violations:
          CANCEL_SHAPE (started run without capture_end_ms or start_uptime_ms; CANCEL with capture_end_ms, warnings or
          command changes) · EVENT_COUNTS (event_log counts differ from the array lengths) · EVENT_ORDER (complete log:
          seq 0..n-1; incomplete: strictly increasing; t_ms never decreasing in seq order) · COMMAND_ORDER (same for step
          and command t_ms) · COMMAND_MISSING_STEP0 (started run with a complete log and no command change) ·
          COMMAND_WINDOW (a change after capture_end_ms) · EVENT_PHASE (phase does not match t_ms; ACTIVE_AT_START with
          t_ms > 0) · EVENT_CAUSALITY (status_t_ms after t_ms) · WARNING_PAIRING (per source + limit_id: ACTIVE_AT_START /
          RAISED only from clear, CLEARED only from active, STATUS_KNOWN only from unknown) · COMMAND_LINK (owned reading
          not stored / no b5 / earlier than the change / other rpm_cmd / owned twice; READING_NOT_RETAINED below held_count;
          linked readings not increasing; SUPERSEDED without a later change; NO_READING not last; complete log with an
          unowned stored b5 reading).
        - Incomplete log (event_log.complete = false): a CLEARED / STATUS_KNOWN whose opening event, or a SUPERSEDED whose
          successor, may have been lost is accepted unchanged and listed in the run's unproven[] (fixture 71), but only
          when a loss before it is possible (seq gap at or before it, first seq > 0, or lost_count null); otherwise
          WARNING_PAIRING / COMMAND_LINK as for a complete log.
        - Stored, never rejected: event_digest_match (the ERP recomputes MTEVT2 from the stored arrays plus started,
          capture_end_ms and start_uptime_ms) and b6_coverage_ok (a stored b6 reading outside every active / unknown
          warning interval makes it false).
        - Receipt: an MTRCPT2 signed_receipt (receipt_version 2, pinned with the run), fixtures 70-72.
      parameters:
        - $ref: '#/components/parameters/AppVersion'
        - name: Idempotency-Key
          in: header
          required: true
          description: Must equal body.test_id.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: |
                v0.3 (no contract_version), v0.4 (contract_version "0.4") or v0.5 (contract_version "0.5"). The three schemas
                are exclusive and contract_version selects the schema: RunUpload has no contract_version, RunUploadV04 only
                allows "0.4" and RunUploadV05 only "0.5" (OpenAPI 3.0 has no const, so each uses a one-value enum; a
                discriminator is not used because the v0.3 schema has no contract_version). Any other contract_version
                is 400 VALIDATION_ERROR; a v0.5 field in a v0.4 body is 400 ("is a v0.5 field: send contract_version 0.5").
              oneOf:
                - $ref: '#/components/schemas/RunUpload'
                - $ref: '#/components/schemas/RunUploadV04'
                - $ref: '#/components/schemas/RunUploadV05'
      responses:
        '201':
          description: Stored. Fixtures 10, 13, 14 (v0.3); 60, 61, 62, 63 (v0.4, MTRCPT1 signed_receipt); 70, 71, 72 (v0.5, MTRCPT2 signed_receipt).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '200':
          description: Identical retry; original receipt, byte-identical (v0.4 / v0.5 signed_receipt included). Fixtures 11, 60, 70.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receipt' }
        '400': { description: 'VALIDATION_ERROR (fields[]) or UNKNOWN_REFERENCE. Fixtures 20, 21, 22, 28, 31, 67; v0.5 EVENT_FIELDS (path "events", msg "EVENT_FIELDS: ...") fixture 74.', $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { description: 'AUTH_INVALID_TOKEN (re-login) or TESTING_ROLE_REQUIRED (NEEDS_REVIEW). Fixture 03.', $ref: '#/components/responses/Error' }
        '409': { description: 'PAYLOAD_CONFLICT. Fixture 12.', $ref: '#/components/responses/Error' }
        '413': { description: 'PAYLOAD_TOO_LARGE (limit 5 MB). Fixture 29.', $ref: '#/components/responses/Error' }
        '422': { description: 'INCONSISTENT_RUN (violations[]). Fixtures 23-27, 65, 66, 68; v0.5 event rules fixtures 73 (WARNING_PAIRING), 75 (COMMAND_MISSING_STEP0). RUN_KIND_NOT_ALLOWED (v0.4 / v0.5). Fixture 64.', $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { description: 'SERVER_UNAVAILABLE / AUTH_UNAVAILABLE - nothing committed, retry same body with backoff. Fixture 30.', $ref: '#/components/responses/Error' }
    get:
      tags: [results]
      summary: All runs for one exact motor serial, newest first (operator, viewer, testing_head, testing_admin)
      parameters:
        - { name: serial, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Fixture 40-results-by-serial.json; v0.5 runs fixture 76 (event_log_complete, unproven_count).
          content:
            application/json:
              schema:
                type: object
                properties:
                  motor_serial: { type: string }
                  runs: { type: array, items: { $ref: '#/components/schemas/RunSummary' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/testing/results/{test_id}/corrections:
    parameters:
      - { name: test_id, in: path, required: true, schema: { type: string, format: uuid } }
      - $ref: '#/components/parameters/AppVersion'
    get:
      tags: [results]
      summary: NEW v0.3 - corrections of one run, newest first (operator, viewer, testing_head, testing_admin)
      responses:
        '200':
          description: Fixture 51-corrections-list.json.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Correction' } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [results]
      summary: NEW v0.3 - operator requests a correction of a stored run (from the tablet)
      description: |
        Requires the operator testing role. Only motor_serial, operator_ref or a remark can be corrected;
        readings and verdicts never change. The original run is never edited; the correction is a new record
        that the testing head approves or rejects in the ERP (someone other than who added it).
        An APPROVED motor_serial correction makes the run findable under the corrected serial as well.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [corrected_fields, reason]
              properties:
                corrected_fields:
                  type: object
                  additionalProperties: false
                  minProperties: 1
                  properties:
                    motor_serial: { type: string, minLength: 1, maxLength: 64 }
                    operator_ref: { type: string, format: uuid }
                    remark: { type: string, minLength: 1, maxLength: 500 }
                reason: { type: string, minLength: 1, maxLength: 500 }
                operator_ref: { type: string, format: uuid, nullable: true, description: 'Who is asking (pick-list), while the account is shared' }
      responses:
        '201':
          description: Correction recorded as PENDING. Fixture 50-correction-add.json.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Correction' }
        '400': { description: 'VALIDATION_ERROR or UNKNOWN_REFERENCE (operator not in the pick-list)', $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/testing/results/{test_id}:
    get:
      tags: [results]
      summary: Full run with samples, events and the exact profile + criteria snapshot used
      parameters:
        - { name: test_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: |
            The stored upload fields (RunUpload / RunUploadV04 / RunUploadV05; profile_sha256 and criteria_sha256 are
            not repeated, see profile and criteria) plus variant_code, uploaded_by, received_at, receipt, profile and
            criteria snapshots, a page of samples (samples_offset / samples_limit, default 2000, max 5000), and the run
            fields listed in RunDetailV04Fields (null for v0.3 runs, except contract_version "0.3") and
            RunDetailV05Fields (receipt_version on every run; the event fields only on v0.5 runs). Fixture 71
            (run_detail) shows a v0.5 run with an incomplete event log.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RunDetailBase'
                  - $ref: '#/components/schemas/RunDetailV04Fields'
                  - $ref: '#/components/schemas/RunDetailV05Fields'
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: HMI app version (semver). Gives the 12 h token at login; send on every call.
      schema: { type: string, example: 1.0.0 }
  responses:
    Error:
      description: Error. Body {error, code, ...details}.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Digest:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string, description: Human message for display }
        code:
          type: string
          enum: [AUTH_MISSING_FIELDS, AUTH_INVALID_CREDENTIALS, AUTH_NO_TOKEN, AUTH_INVALID_TOKEN, AUTH_INVALID_USER, AUTH_UNAVAILABLE,
                 TESTING_ROLE_REQUIRED, PERM_DENIED, RATE_LIMIT_EXCEEDED, NOT_FOUND, NOT_PUBLISHED,
                 VALIDATION_ERROR, UNKNOWN_REFERENCE, PAYLOAD_CONFLICT, PAYLOAD_TOO_LARGE, INCONSISTENT_RUN, SERVER_UNAVAILABLE,
                 RUN_KIND_NOT_ALLOWED]
          description: 'RUN_KIND_NOT_ALLOWED (v0.4, 422): run_kind not accepted by this server (production accepts only bench).'
        fields:
          type: array
          description: |
            VALIDATION_ERROR / UNKNOWN_REFERENCE. v0.5 event field errors come back as one entry
            {path: "events", msg: "EVENT_FIELDS: <message>"} (fixture 74); path "events" names the v0.5 event section
            (warnings, command_changes, event_log, capture_end_ms), not the v0.3 events[] array.
          items: { type: object, properties: { path: { type: string }, msg: { type: string } } }
        violations:
          type: array
          description: |
            INCONSISTENT_RUN. rule is one of PASS_REQUIRES_COMPLETED, COMPLETE_EVIDENCE_REQUIRED, DIGEST_MATCH_REQUIRED,
            VALIDITY_FLAG_MISMATCH, LIFECYCLE_STOP_REASON (v0.3 and v0.4); RECORDING_COMPLETE_REQUIRED,
            RECORDING_COMPLETE_COUNTS, CANCEL_SHAPE, START_UPTIME_REQUIRED, HELD_COUNT_RANGE, TOO_MANY_SAMPLES,
            SEQ_OUT_OF_RANGE, TIME_SOURCE (v0.4 and v0.5); with path "events" (v0.5, at most one): EVENT_ORDER, EVENT_PHASE,
            EVENT_CAUSALITY, EVENT_COUNTS, WARNING_PAIRING, COMMAND_ORDER, COMMAND_LINK, COMMAND_WINDOW,
            COMMAND_MISSING_STEP0, CANCEL_SHAPE (fixtures 73, 75). See POST /api/testing/results.
          items: { type: object, properties: { path: { type: string }, rule: { type: string }, msg: { type: string } } }
        test_id: { type: string, format: uuid }
        existing_payload_hash: { $ref: '#/components/schemas/Digest' }
        received_payload_hash: { $ref: '#/components/schemas/Digest' }
        required_role: { type: string }
    VariantSummary:
      type: object
      properties:
        variant_id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        product_id: { type: integer, description: inventory.product_id }
        active: { type: boolean }
        has_published_config: { type: boolean }
    Profile:
      type: object
      required: [profile_id, variant_id, version, max_rpm, step_rpm, duration_s, sample_hz, sha256, status]
      properties:
        profile_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        version: { type: integer }
        max_rpm: { type: integer }
        step_rpm: { type: integer }
        duration_s: { type: integer }
        sample_hz: { type: integer }
        sha256: { $ref: '#/components/schemas/Digest' }
        status: { type: string, enum: [PUBLISHED, SUPERSEDED, WITHDRAWN] }
        published_at: { type: string, format: date-time }
    CriteriaVersion:
      type: object
      required: [criteria_version_id, version, sha256, status, definition]
      properties:
        criteria_version_id: { type: string, format: uuid }
        variant_id: { type: string, format: uuid }
        version: { type: integer }
        sha256: { $ref: '#/components/schemas/Digest' }
        status: { type: string, enum: [PUBLISHED, SUPERSEDED, WITHDRAWN] }
        published_at: { type: string, format: date-time }
        definition: { type: object, description: 'criteria_json; values only from the signed sheet (D5)' }
    VariantDetail:
      allOf:
        - $ref: '#/components/schemas/VariantSummary'
        - type: object
          properties:
            serial_pattern: { type: string, nullable: true }
            max_rpm_limit: { type: integer, nullable: true }
            profile: { $ref: '#/components/schemas/Profile' }
            criteria: { $ref: '#/components/schemas/CriteriaVersion' }
    Sample:
      type: object
      additionalProperties: false
      required: [sample_seq, t_ms, rpm_cmd, rpm_actual, current_a, voltage_v, bemf_v, status_flags]
      properties:
        sample_seq: { type: integer, minimum: 0, maximum: 4294967295 }
        t_ms: { type: integer, minimum: 0, maximum: 4294967295 }
        rpm_cmd: { type: integer, minimum: -2147483648, maximum: 2147483647 }
        rpm_actual: { type: integer, minimum: -2147483648, maximum: 2147483647 }
        current_a: { type: number, nullable: true, description: 'null iff status_flags b1 = 0; shortest float32 round-trip decimal' }
        voltage_v: { type: number, nullable: true, description: 'null iff status_flags b2 = 0' }
        bemf_v: { type: number, nullable: true, description: 'null iff status_flags b3 = 0' }
        status_flags: { type: integer, minimum: 0, maximum: 255, description: 'b0 rpm valid, b1 I, b2 V, b3 BEMF, b4 CAN stale, b5 setpoint changed, b6 protective warning, b7 storage lag; b8-b15 must be 0' }
    Event:
      type: object
      required: [t_ms, type, code]
      properties:
        t_ms: { type: integer, minimum: 0 }
        type: { type: string, enum: [STATE, FAULT, COMMAND, INFO] }
        code: { type: string }
        detail: { type: string, nullable: true }
    RunUpload:
      description: v0.3 upload (no contract_version). The format the deployed tablet app sends; stays accepted.
      type: object
      additionalProperties: false
      required: [test_id, motor_serial, variant_id, profile_id, profile_sha256, criteria_version_id, criteria_sha256,
                 operator_id, operator_ref, operator_name, vcu, hmi_version, started_at, ended_at, final_state, stop_reason, fault_code,
                 outcome, outcome_reasons, sample_count, run_digest, events, samples]
      properties:
        test_id: { type: string, format: uuid, description: UUID v4 created once by the HMI; retest = new UUID }
        motor_serial: { type: string, minLength: 1, maxLength: 64 }
        variant_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        profile_sha256: { $ref: '#/components/schemas/Digest' }
        criteria_version_id: { type: string, format: uuid }
        criteria_sha256: { $ref: '#/components/schemas/Digest' }
        operator_id: { type: integer, description: ERP user who ran the test (the shared testing account for now) }
        operator_ref: { type: string, format: uuid, description: 'Person picked from GET /api/testing/operators; must have been active when the run started, else 400 UNKNOWN_REFERENCE (fixture 31)' }
        operator_name: { type: string, minLength: 1, maxLength: 100, description: Snapshot of the picked name at test time (kept even if the list changes later) }
        vcu:
          type: object
          additionalProperties: false
          required: [vcu_id, fw_version, boot_id]
          properties:
            vcu_id: { type: string }
            fw_version: { type: string }
            boot_id: { type: string }
        hmi_version: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        final_state: { type: string, enum: [COMPLETED, ABORTED, FAULT] }
        stop_reason: { type: string, enum: [RAMP_COMPLETE, OPERATOR_STOP, HB_LOSS, FAULT, POWER_LOSS] }
        fault_code: { type: string, nullable: true, description: 'F_* catalogue; required when final_state = FAULT' }
        outcome: { type: string, enum: [PASS, FAIL, INCOMPLETE, INVALID] }
        outcome_reasons:
          type: array
          items:
            type: object
            properties:
              criterion: { type: string, nullable: true }
              reason: { type: string }
              measured: { type: number, nullable: true }
              limit: { type: number, nullable: true }
              unit: { type: string }
              rpm_window: { type: array, items: { type: integer } }
              samples: { type: array, items: { type: integer } }
              detail: { type: string, nullable: true }
        sample_count: { type: integer, minimum: 0, description: VCU manifest count }
        run_digest: { $ref: '#/components/schemas/Digest' }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        samples: { type: array, maxItems: 40000, description: 'max 40000 so a run fits the 5 MB body limit', items: { $ref: '#/components/schemas/Sample' } }
    Receipt:
      type: object
      required: [receipt_id, test_id, stored_sample_count, payload_hash, samples_digest, run_digest_match, stored_at]
      properties:
        receipt_id: { type: string, format: uuid }
        test_id: { type: string, format: uuid }
        stored_sample_count: { type: integer }
        payload_hash: { $ref: '#/components/schemas/Digest' }
        samples_digest: { $ref: '#/components/schemas/Digest', description: D13 digest the ERP computed over the stored samples }
        run_digest_match: { type: boolean, description: samples_digest equals run_digest }
        stored_at: { type: string, format: date-time, description: Time of the original commit (unchanged on retries) }
        signed_receipt:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SignedReceipt'
          description: |
            v0.4 and v0.5 receipts only (absent from v0.3 receipts). null when the server has no signing key configured.
            v0.4 runs: MTRCPT1 message; v0.5 runs: MTRCPT2 message (the run's receipt_version, pinned when stored).
            Built and signed once at the original commit; a 200 identical retry returns it byte-identical.
            Never in a 409 or any other 4xx/5xx.
    SignedReceipt:
      type: object
      additionalProperties: false
      required: [alg, key_id, message, signature]
      description: |
        receipt-signing.md sections 4-5 and 11. The VCU decides only from the signed message bytes (section 6 / 11.3);
        the tablet forwards message and signature to the VCU unchanged. The message format follows the run's
        receipt_version: MTRCPT1 (172-234 bytes, v0.4 runs) or MTRCPT2 (253-315 bytes, v0.5 runs). The VCU selects
        the decoder from the receipt_version in its own run manifest, never from the received magic (no fallback).
        MTRCPT1 signs, among others, sample_count, held_count, stored_sample_count, final_state, outcome, stop_reason,
        flags (b0 run_digest_match, b1 held_count_match, b2 = the uploaded recording_complete, b3 = started),
        run_digest, samples_digest, payload_hash, vcu_id and origin_boot_id. MTRCPT2 = the same fields with magic
        "MTRCPT2\0" plus an event block: event_digest (as uploaded), events_stored_digest (recomputed by the ERP),
        warnings_count, command_changes_count, event flags (b0 event_digest_match, b1 event_log_complete,
        b2 b6_coverage_ok, b3 capture_end present, b4 start_uptime present), capture_end_ms and start_uptime_ms.
      properties:
        alg: { type: string, enum: [Ed25519], description: 'Pure Ed25519 (RFC 8032 5.1), no prehash, no context' }
        key_id: { type: string, pattern: '^[0-9a-f]{16}$', description: First 8 bytes of SHA-256(public key), lowercase hex }
        message: { type: string, pattern: '^[A-Za-z0-9_-]+$', minLength: 230, maxLength: 420, description: 'Strict base64url (RFC 4648 section 5, no padding) of the signed message bytes: 230-312 characters for MTRCPT1 (172-234 bytes), 338-420 for MTRCPT2 (253-315 bytes)' }
        signature: { type: string, pattern: '^[A-Za-z0-9_-]{86}$', description: Strict base64url of the 64-byte signature (R||S) }
    RunUploadV04:
      description: |
        v0.4 upload (opt-in with contract_version "0.4"; live on staging and production). The v0.3 fields
        with these changes: vcu.boot_id -> vcu.origin_boot_id; new run_kind, started, start_uptime_ms,
        started_at_source, ended_at_source, hmi_auto_time, held_count, recording_complete, config_hash;
        stop_reason adds CONFIG_CANCELLED; run_digest = D13 over the held samples 0..held_count-1.
      type: object
      additionalProperties: false
      required: [contract_version, test_id, motor_serial, variant_id, profile_id, profile_sha256, criteria_version_id, criteria_sha256,
                 operator_id, operator_ref, operator_name, vcu, hmi_version, run_kind, started, start_uptime_ms,
                 started_at, started_at_source, ended_at, ended_at_source, hmi_auto_time, final_state, stop_reason, fault_code,
                 outcome, outcome_reasons, sample_count, held_count, recording_complete, config_hash, run_digest, events, samples]
      properties:
        contract_version: { type: string, enum: ['0.4'] }
        test_id: { type: string, format: uuid, description: UUID v4 created once by the HMI; retest = new UUID }
        motor_serial: { type: string, minLength: 1, maxLength: 64 }
        variant_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        profile_sha256: { $ref: '#/components/schemas/Digest' }
        criteria_version_id: { type: string, format: uuid }
        criteria_sha256: { $ref: '#/components/schemas/Digest' }
        operator_id: { type: integer }
        operator_ref: { type: string, format: uuid }
        operator_name: { type: string, minLength: 1, maxLength: 100 }
        vcu:
          type: object
          additionalProperties: false
          required: [vcu_id, fw_version, origin_boot_id]
          description: vcu.boot_id is not allowed in v0.4 (400 VALIDATION_ERROR, fixture 67).
          properties:
            vcu_id: { type: string, minLength: 1, maxLength: 32, pattern: '^[A-Za-z0-9._-]{1,32}$', example: esp32c3-001122334455 }
            fw_version: { type: string, minLength: 1, maxLength: 64 }
            origin_boot_id: { type: string, minLength: 1, maxLength: 32, pattern: '^[A-Za-z0-9._-]{1,32}$', example: '1122334455667788', description: The VCU boot the run started in (not the reconnect/recovery boot) }
        hmi_version: { type: string }
        run_kind: { type: string, enum: [bench, host_simulation, synthetic], description: 'Production accepts only bench; staging accepts all three. Else 422 RUN_KIND_NOT_ALLOWED.' }
        started: { type: boolean, description: "The VCU's own field: durable START intent and acquisition clock established (not proof of motor movement)" }
        start_uptime_ms: { type: integer, minimum: 0, maximum: 4294967295, nullable: true, description: 'VCU uptime at START in origin_boot_id; null exactly when started = false' }
        started_at: { type: string, format: date-time, nullable: true, description: Approximate tablet UTC; null = UTC unknown }
        started_at_source: { type: string, enum: [HMI, HMI_DERIVED, null], nullable: true, description: null exactly when started_at is null }
        ended_at: { type: string, format: date-time, nullable: true }
        ended_at_source: { type: string, enum: [HMI, HMI_DERIVED, null], nullable: true, description: null exactly when ended_at is null }
        hmi_auto_time: { type: boolean, nullable: true, description: "The tablet's automatic network time SETTING when the stamp was taken; not proof of sync" }
        final_state: { type: string, enum: [COMPLETED, ABORTED, FAULT] }
        stop_reason: { type: string, enum: [RAMP_COMPLETE, OPERATOR_STOP, HB_LOSS, FAULT, POWER_LOSS, CONFIG_CANCELLED] }
        fault_code: { type: string, nullable: true, description: 'required when final_state = FAULT (e.g. SAMPLE_LOSS)' }
        outcome: { type: string, enum: [PASS, FAIL, INCOMPLETE, INVALID] }
        outcome_reasons: { type: array, items: { $ref: '#/components/schemas/OutcomeReason' } }
        sample_count: { type: integer, minimum: 0, maximum: 4294967295, description: "VCU's declared acquisition slots in the actual capture window, incl. known missed slots" }
        held_count: { type: integer, minimum: 0, maximum: 4294967295, description: 'Contiguous validated prefix the VCU holds (sample_seq 0..held_count-1), covered by run_digest; 0..sample_count' }
        recording_complete: { type: boolean, description: "The VCU's own flag; equal counts alone never imply it. Signed as receipt flag b2." }
        config_hash: { type: string, minLength: 1, maxLength: 128, nullable: true, description: CONFIG hash from CONFIG_ACK; stored as given }
        run_digest: { $ref: '#/components/schemas/Digest' }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        samples: { type: array, maxItems: 40000, items: { $ref: '#/components/schemas/Sample' } }
    RunUploadV05:
      description: |
        v0.5 upload (opt-in with contract_version "0.5"; DRAFT R4, implemented, not deployed yet). Exactly the v0.4
        fields and rules (RunUploadV04) plus capture_end_ms, event_log, warnings, command_changes and event_digest
        (v05-warning-events.md sections 1-6). The response receipt carries an MTRCPT2 signed_receipt.
        Shapes (422 CANCEL_SHAPE): a started run has capture_end_ms and start_uptime_ms; a CANCEL (started = false)
        has capture_end_ms null, no warnings and no command changes. Event times are run-relative ms on the same origin
        as samples[].t_ms. Fixtures 70-75.
      type: object
      additionalProperties: false
      required: [contract_version, test_id, motor_serial, variant_id, profile_id, profile_sha256, criteria_version_id, criteria_sha256,
                 operator_id, operator_ref, operator_name, vcu, hmi_version, run_kind, started, start_uptime_ms,
                 started_at, started_at_source, ended_at, ended_at_source, hmi_auto_time, final_state, stop_reason, fault_code,
                 outcome, outcome_reasons, sample_count, held_count, recording_complete, config_hash, run_digest, events, samples,
                 capture_end_ms, event_log, warnings, command_changes, event_digest]
      properties:
        contract_version: { type: string, enum: ['0.5'] }
        test_id: { type: string, format: uuid, description: UUID v4 created once by the HMI; retest = new UUID }
        motor_serial: { type: string, minLength: 1, maxLength: 64 }
        variant_id: { type: string, format: uuid }
        profile_id: { type: string, format: uuid }
        profile_sha256: { $ref: '#/components/schemas/Digest' }
        criteria_version_id: { type: string, format: uuid }
        criteria_sha256: { $ref: '#/components/schemas/Digest' }
        operator_id: { type: integer }
        operator_ref: { type: string, format: uuid }
        operator_name: { type: string, minLength: 1, maxLength: 100 }
        vcu:
          type: object
          additionalProperties: false
          required: [vcu_id, fw_version, origin_boot_id]
          properties:
            vcu_id: { type: string, minLength: 1, maxLength: 32, pattern: '^[A-Za-z0-9._-]{1,32}$', example: esp32c3-001122334455 }
            fw_version: { type: string, minLength: 1, maxLength: 64 }
            origin_boot_id: { type: string, minLength: 1, maxLength: 32, pattern: '^[A-Za-z0-9._-]{1,32}$', example: '1122334455667788', description: 'The VCU boot the run started in; signed in MTRCPT2 (not part of the MTEVT2 digest)' }
        hmi_version: { type: string }
        run_kind: { type: string, enum: [bench, host_simulation, synthetic], description: 'Production accepts only bench; staging accepts all three. Else 422 RUN_KIND_NOT_ALLOWED.' }
        started: { type: boolean }
        start_uptime_ms: { type: integer, minimum: 0, maximum: 4294967295, nullable: true, description: 'null exactly when started = false; bound into the MTEVT2 event digest' }
        started_at: { type: string, format: date-time, nullable: true }
        started_at_source: { type: string, enum: [HMI, HMI_DERIVED, null], nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        ended_at_source: { type: string, enum: [HMI, HMI_DERIVED, null], nullable: true }
        hmi_auto_time: { type: boolean, nullable: true }
        final_state: { type: string, enum: [COMPLETED, ABORTED, FAULT] }
        stop_reason: { type: string, enum: [RAMP_COMPLETE, OPERATOR_STOP, HB_LOSS, FAULT, POWER_LOSS, CONFIG_CANCELLED] }
        fault_code: { type: string, nullable: true }
        outcome: { type: string, enum: [PASS, FAIL, INCOMPLETE, INVALID] }
        outcome_reasons: { type: array, items: { $ref: '#/components/schemas/OutcomeReason' } }
        sample_count: { type: integer, minimum: 0, maximum: 4294967295 }
        held_count: { type: integer, minimum: 0, maximum: 4294967295 }
        recording_complete: { type: boolean }
        config_hash: { type: string, minLength: 1, maxLength: 128, nullable: true }
        run_digest: { $ref: '#/components/schemas/Digest' }
        events: { type: array, items: { $ref: '#/components/schemas/Event' }, description: 'v0.3 state/fault event list, unchanged; the v0.5 warning journal is warnings[]' }
        samples: { type: array, maxItems: 40000, items: { $ref: '#/components/schemas/Sample' } }
        capture_end_ms: { type: integer, minimum: 0, maximum: 4294967295, nullable: true, description: 'Run-relative time capture closed; null exactly for a CANCEL (started = false). Bound into MTEVT2; signed in MTRCPT2.' }
        event_log: { $ref: '#/components/schemas/EventLog' }
        warnings: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/WarningEvent' }, description: 'Warning journal in seq order. Empty with a complete log = no warnings; with an incomplete log it proves nothing.' }
        command_changes: { type: array, maxItems: 10000, items: { $ref: '#/components/schemas/CommandChange' }, description: 'Effective command changes in step order; step 0 (applied by START) is always recorded' }
        event_digest:
          allOf: [{ $ref: '#/components/schemas/Digest' }]
          description: |
            MTEVT2 digest computed by the VCU (v05-warning-events.md section 6): SHA-256 over little-endian bytes of
            started, capture_end_ms, start_uptime_ms, every warning (detail text excluded), every command change and the
            event_log completeness / lost_count, optional values as presence byte + value. The ERP recomputes it
            (events_stored_digest) and stores event_digest_match; a mismatch is stored and signed, never rejected.
    WarningEvent:
      type: object
      additionalProperties: false
      required: [seq, t_ms, phase, kind, source, limit_id, code, status_t_ms, reason, restored_state, detail]
      description: |
        One warning journal record (v05-warning-events.md section 3). Every field is sent, null when not applicable.
        Enum values must match exactly (own values; "toString", "constructor" etc. are 400 EVENT_FIELDS). Field
        combinations (400 EVENT_FIELDS):
        - kinds ACTIVE_AT_START, RAISED, CLEARED, STATUS_UNKNOWN, STATUS_KNOWN only with source STATUS_BIT6 or VCU_LIMIT;
          DETAIL, DETAIL_UNAVAILABLE, DETAIL_AMBIGUOUS only with source SDO_2031_11;
        - limit_id only and always with source VCU_LIMIT;
        - code only and always on DETAIL and DETAIL_AMBIGUOUS;
        - status_t_ms only and always on the detail kinds (and <= t_ms, else 422 EVENT_CAUSALITY);
        - reason only and always on DETAIL_UNAVAILABLE (TIMEOUT, ABORT or MALFORMED) and DETAIL_AMBIGUOUS (LATE_REPLY);
        - restored_state only and always on STATUS_KNOWN;
        - detail: free text, never part of the digest.
        Order and pairing rules (422): EVENT_ORDER, EVENT_PHASE, WARNING_PAIRING; see POST /api/testing/results.
      properties:
        seq: { type: integer, minimum: 0, maximum: 4294967295, description: 'Journal order: 0..n-1 when the log is complete; strictly increasing with gaps (lost events) when not' }
        t_ms: { type: integer, minimum: -2147483648, maximum: 2147483647, description: 'Signed run-relative ms (receive time for detail records); never decreasing in seq order (equal allowed)' }
        phase: { type: string, enum: [PRE_START, CAPTURE, POST_CAPTURE], description: 'Must match t_ms: < 0 PRE_START, 0..capture_end_ms CAPTURE, > capture_end_ms POST_CAPTURE (422 EVENT_PHASE)' }
        kind:
          type: string
          enum: [ACTIVE_AT_START, RAISED, CLEARED, STATUS_UNKNOWN, STATUS_KNOWN, DETAIL, DETAIL_UNAVAILABLE, DETAIL_AMBIGUOUS]
          description: 'ACTIVE_AT_START needs t_ms <= 0 (422 EVENT_PHASE). STATUS_UNKNOWN / STATUS_KNOWN are not transitions; the unknown span counts as warning-active for evaluation.'
        source: { type: string, enum: [STATUS_BIT6, VCU_LIMIT, SDO_2031_11] }
        limit_id: { type: string, pattern: '^[A-Z0-9_]{1,40}$', nullable: true, description: 'Only and always with source VCU_LIMIT' }
        code: { type: integer, minimum: 0, maximum: 65535, nullable: true, description: 'Raw detail code, only on DETAIL and DETAIL_AMBIGUOUS; unknown codes stay numbers' }
        status_t_ms: { type: integer, minimum: -2147483648, maximum: 2147483647, nullable: true, description: 'Detail kinds only: time of the triggering status observation; must be <= t_ms (422 EVENT_CAUSALITY)' }
        reason: { type: string, enum: [TIMEOUT, ABORT, MALFORMED, LATE_REPLY, null], nullable: true, description: 'DETAIL_UNAVAILABLE: TIMEOUT, ABORT or MALFORMED; DETAIL_AMBIGUOUS: LATE_REPLY only; else null' }
        restored_state: { type: string, enum: [ACTIVE, CLEAR, null], nullable: true, description: 'Only and always on STATUS_KNOWN: the warning state observed when status became known again' }
        detail: { type: string, maxLength: 200, nullable: true, description: Free diagnostic text; not part of the digest }
    CommandChange:
      type: object
      additionalProperties: false
      required: [step, t_ms, rpm_cmd, link, first_sample_seq]
      description: |
        One effective command change (v05-warning-events.md section 4). first_sample_seq is set exactly for links
        OWNS_READING and READING_NOT_RETAINED, else null (400 EVENT_FIELDS). Link rules (422 COMMAND_LINK):
        OWNS_READING = the stored reading carrying its b5 marker, not earlier than the change, with the same rpm_cmd,
        owned once; SUPERSEDED = a later change exists in the array; NO_READING = only the last change (capture ended
        before a reading); READING_NOT_RETAINED = sample_seq >= held_count (acquired but lost). Linked readings increase
        with the step. Complete log: a started run must contain step 0 (422 COMMAND_MISSING_STEP0) and every stored b5
        reading must be owned. Incomplete log: lost changes leave gaps in step (never renumbered).
      properties:
        step: { type: integer, minimum: 0, maximum: 4294967295, description: '0 = the first effective command applied by START (always recorded); 0..n-1 when the log is complete; strictly increasing with gaps when not' }
        t_ms: { type: integer, minimum: 0, maximum: 2147483647, description: 'VCU time the change took effect; 0 <= t_ms <= capture_end_ms (422 COMMAND_WINDOW); never decreasing (422 COMMAND_ORDER)' }
        rpm_cmd: { type: integer, minimum: -2147483648, maximum: 2147483647, description: The new effective command }
        link: { type: string, enum: [OWNS_READING, SUPERSEDED, NO_READING, READING_NOT_RETAINED] }
        first_sample_seq: { type: integer, minimum: 0, maximum: 4294967295, nullable: true }
    EventLog:
      type: object
      additionalProperties: false
      required: [warnings_count, command_changes_count, complete, lost_count]
      description: |
        Completeness of the event journal, separate from recording_complete (v05-warning-events.md section 5). The counts
        must equal the array lengths (422 EVENT_COUNTS). lost_count is 0 when complete; when not complete null (unknown)
        or 1..4294967294 (4294967295 is never valid); anything else is 400 EVENT_FIELDS. An incomplete log makes the run
        INVALID for evaluation (S4) but is stored and can be released.
      properties:
        warnings_count: { type: integer, minimum: 0, maximum: 4294967295 }
        command_changes_count: { type: integer, minimum: 0, maximum: 4294967295 }
        complete: { type: boolean }
        lost_count: { type: integer, minimum: 0, maximum: 4294967294, nullable: true }
    UnprovenRecord:
      type: object
      description: |
        A record of an incomplete event log that was kept as recorded although a relationship could not be proven
        because its partner may have been lost: a warning (seq, rule WARNING_PAIRING) or a SUPERSEDED command change
        (step, rule COMMAND_LINK). Evidence-quality fact for evaluation, never a repair.
      required: [rule, note]
      properties:
        seq: { type: integer, minimum: 0, maximum: 4294967295, description: Warning seq (WARNING_PAIRING) }
        step: { type: integer, minimum: 0, maximum: 4294967295, description: Command step (COMMAND_LINK) }
        rule: { type: string, enum: [WARNING_PAIRING, COMMAND_LINK] }
        note: { type: string }
    OutcomeReason:
      type: object
      properties:
        criterion: { type: string, nullable: true }
        reason: { type: string }
        measured: { type: number, nullable: true }
        limit: { type: number, nullable: true }
        unit: { type: string }
        rpm_window: { type: array, items: { type: integer } }
        samples: { type: array, items: { type: integer } }
        detail: { type: string, nullable: true }
    RunDetailV04Fields:
      type: object
      description: Returned for every run by GET /api/testing/results/{test_id}. For v0.3 runs all are null except contract_version "0.3".
      properties:
        contract_version: { type: string, enum: ['0.3', '0.4', '0.5'] }
        run_kind: { type: string, enum: [bench, host_simulation, synthetic, null], nullable: true }
        started: { type: boolean, nullable: true }
        start_uptime_ms: { type: integer, nullable: true }
        started_at_source: { type: string, enum: [HMI, HMI_DERIVED, null], nullable: true }
        ended_at_source: { type: string, enum: [HMI, HMI_DERIVED, null], nullable: true }
        hmi_auto_time: { type: boolean, nullable: true }
        held_count: { type: integer, nullable: true }
        recording_complete: { type: boolean, nullable: true }
        config_hash: { type: string, nullable: true }
        origin_boot_id: { type: string, nullable: true }
    RunDetailBase:
      type: object
      description: The common run detail fields of GET /api/testing/results/{test_id} (every contract version).
      properties:
        test_id: { type: string, format: uuid }
        motor_serial: { type: string }
        variant_id: { type: string, format: uuid }
        variant_code: { type: string }
        profile_id: { type: string, format: uuid }
        criteria_version_id: { type: string, format: uuid }
        operator_id: { type: integer }
        operator_ref: { type: string, format: uuid }
        operator_name: { type: string }
        uploaded_by: { type: integer }
        vcu:
          type: object
          description: '{vcu_id, fw_version, boot_id} for v0.3 runs; {vcu_id, fw_version, origin_boot_id} for v0.4 / v0.5 runs'
          properties:
            vcu_id: { type: string }
            fw_version: { type: string }
            boot_id: { type: string }
            origin_boot_id: { type: string }
        hmi_version: { type: string }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        final_state: { type: string, enum: [COMPLETED, ABORTED, FAULT] }
        stop_reason: { type: string, enum: [RAMP_COMPLETE, OPERATOR_STOP, HB_LOSS, FAULT, POWER_LOSS, CONFIG_CANCELLED] }
        fault_code: { type: string, nullable: true }
        outcome: { type: string, enum: [PASS, FAIL, INCOMPLETE, INVALID] }
        outcome_reasons: { type: array, items: { $ref: '#/components/schemas/OutcomeReason' } }
        sample_count: { type: integer }
        run_digest: { $ref: '#/components/schemas/Digest' }
        received_at: { type: string, format: date-time }
        receipt: { $ref: '#/components/schemas/Receipt' }
        profile: { $ref: '#/components/schemas/Profile' }
        criteria: { $ref: '#/components/schemas/CriteriaVersion' }
        events: { type: array, items: { $ref: '#/components/schemas/Event' } }
        samples: { type: array, items: { $ref: '#/components/schemas/Sample' } }
        samples_page:
          type: object
          properties:
            offset: { type: integer }
            limit: { type: integer }
            returned: { type: integer }
            total: { type: integer, description: stored_sample_count }
    RunDetailV05Fields:
      type: object
      description: |
        receipt_version is returned for every run (null for v0.3, 1 for v0.4, 2 for v0.5). The other fields are
        returned only for v0.5 runs (absent otherwise): the stored event section and the facts the ERP derived from it.
      properties:
        receipt_version: { type: integer, enum: [1, 2, null], nullable: true, description: 'Signed receipt format pinned when the run was stored: 1 = MTRCPT1 (v0.4), 2 = MTRCPT2 (v0.5), null for v0.3' }
        capture_end_ms: { type: integer, nullable: true, description: null for a CANCEL }
        event_log:
          allOf: [{ $ref: '#/components/schemas/EventLog' }]
          description: As uploaded (lost_count 0 when complete)
        event_digest: { $ref: '#/components/schemas/Digest' }
        events_stored_digest:
          allOf: [{ $ref: '#/components/schemas/Digest' }]
          description: MTEVT2 recomputed by the ERP from the stored arrays and the run's started, capture_end_ms and start_uptime_ms
        event_digest_match: { type: boolean, description: events_stored_digest equals event_digest (MTRCPT2 event flag b0) }
        b6_coverage_ok: { type: boolean, description: 'false when a stored b6 reading lies outside every active / unknown warning interval (signed as MTRCPT2 event flag b2, reported only)' }
        unproven: { type: array, items: { $ref: '#/components/schemas/UnprovenRecord' }, description: 'Records of an incomplete log kept although their relationship could not be proven; empty for a complete log' }
        warnings: { type: array, items: { $ref: '#/components/schemas/WarningEvent' }, description: In seq order }
        command_changes: { type: array, items: { $ref: '#/components/schemas/CommandChange' }, description: In step order }
    Correction:
      type: object
      properties:
        correction_id: { type: string, format: uuid }
        test_id: { type: string, format: uuid }
        corrected_fields: { type: object }
        reason: { type: string }
        added_by: { type: integer }
        added_by_name: { type: string }
        added_operator_ref: { type: string, format: uuid, nullable: true }
        added_operator_name: { type: string, nullable: true }
        added_at: { type: string, format: date-time }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        decided_by: { type: integer, nullable: true }
        decided_by_name: { type: string, nullable: true }
        decided_at: { type: string, format: date-time, nullable: true }
        decision_note: { type: string, nullable: true }
    RunSummary:
      type: object
      properties:
        test_id: { type: string, format: uuid }
        started_at: { type: string, format: date-time, nullable: true }
        ended_at: { type: string, format: date-time, nullable: true }
        final_state: { type: string }
        outcome: { type: string }
        operator_id: { type: integer }
        operator_ref: { type: string, format: uuid }
        operator_name: { type: string }
        uploaded_by: { type: integer }
        variant_code: { type: string }
        profile_version: { type: integer }
        criteria_version: { type: integer }
        sample_count: { type: integer }
        stored_sample_count: { type: integer }
        received_at: { type: string, format: date-time }
        stop_reason: { type: string }
        contract_version: { type: string, enum: ['0.3', '0.4', '0.5'] }
        run_kind: { type: string, enum: [bench, host_simulation, synthetic, null], nullable: true, description: null for v0.3 runs }
        held_count: { type: integer, nullable: true, description: null for v0.3 runs }
        recording_complete: { type: boolean, nullable: true, description: null for v0.3 runs }
        event_log_complete: { type: boolean, nullable: true, description: 'v0.5: event_log.complete; null for v0.3 / v0.4 runs' }
        unproven_count: { type: integer, nullable: true, description: 'v0.5: number of unproven records (0 for a complete log); null for v0.3 / v0.4 runs' }
