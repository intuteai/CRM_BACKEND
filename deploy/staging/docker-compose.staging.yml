# Motor-test STAGING backend (T049). Runs next to production on the same EC2 host.
#   - own image tag (:staging), own env file, own database login (erp_staging_app -> erp_staging only)
#   - memory capped (~150 MB) so it can never starve production; its own small Redis
#   - no host port: the nginx container (erp-nginx-https) reaches it by name on production's
#     Docker network as http://erp-backend-staging:8000 and publishes it at https://api.intute.biz/staging/
# Start: docker-compose -p erp-staging -f docker-compose.staging.yml up -d
# Stop when idle: docker-compose -p erp-staging -f docker-compose.staging.yml down   (only /staging/ then answers 502)
version: "2.4"

services:
  erp-backend-staging:
    image: intuteai/erp-backend:staging
    container_name: erp-backend-staging
    restart: unless-stopped
    env_file: .env.staging          # real values only on the server, never in git
    environment:
      NODE_OPTIONS: "--max-old-space-size=110"
      PORT: "8000"                  # same as production, inside the container
      DISABLE_CRON: "true"
      REDIS_URL: "redis://redis-staging:6379"
    mem_limit: 150m
    memswap_limit: 150m
    depends_on:
      - redis-staging
    networks:
      - staging                     # private: staging backend <-> its Redis
      - erp-backend_default         # shared with production's nginx container only for the proxy

  redis-staging:
    image: redis:7.2.5-alpine
    container_name: erp-redis-staging
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "16mb", "--maxmemory-policy", "allkeys-lru"]
    mem_limit: 32m
    networks:
      - staging                     # not on production's network

networks:
  staging: {}
  erp-backend_default:
    external: true
