name: Deploy CRM Backend STAGING to EC2

# Manual only. Builds the current branch as intuteai/erp-backend:staging and restarts the
# staging containers (port 8001, ~150 MB cap). Production (:latest) is not touched.
# Actions are pinned to commit SHAs (tag in the comment): they receive the EC2 SSH key and Docker Hub login.
on:
  workflow_dispatch:

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push the staging image
        run: |
          docker build -t intuteai/erp-backend:staging .
          docker push intuteai/erp-backend:staging

      - name: SSH to EC2 and restart staging
        uses: appleboy/ssh-action@55dabf81b49d4120609345970c91507e2d734799 # v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/erp-staging
            docker-compose -p erp-staging -f docker-compose.staging.yml pull erp-backend-staging
            docker-compose -p erp-staging -f docker-compose.staging.yml up -d
            docker image prune -f
